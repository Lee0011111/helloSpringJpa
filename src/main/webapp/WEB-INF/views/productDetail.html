<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 상세 정보</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        h1 { border-bottom: 2px solid #4a90d9; padding-bottom: 10px; }
        .info-box { background: #f8f9fa; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .label { font-weight: bold; color: #4a90d9; width: 100px; display: inline-block; }
        .price { color: #e74c3c; font-size: 1.2em; font-weight: bold; }
        .btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h1>상품 상세 정보</h1>
<div class="info-box" th:if="${product != null}">
    <p><span class="label">상품명:</span> <span th:text="${product.name}">상품명</span></p>
    <p><span class="label">카테고리:</span> <span th:text="${product.category != null ? product.category.name : '없음'}">카테고리</span></p>
    <p><span class="label">가격:</span> <span class="price" th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')} + '원'">가격</span></p>
    <p><span class="label">설명:</span></p>
    <div style="white-space: pre-wrap; background: white; padding: 15px; border: 1px solid #eee;" th:text="${product.description}">상품 설명 내용</div>
</div>
<div style="margin-top: 20px;">
    <a th:href="@{/products}" class="btn">목록으로 돌아가기</a>
    <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn" style="background: #4a90d9;">수정하기</a>
</div>
<div style="margin-top: 50px; padding: 20px; background-color: #f8f9fa; text-align: center; font-size: 0.9em;">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></p>
    <p>학번: 1971372 | 성명: 이현동</p>
</div>
</body>
</html>
