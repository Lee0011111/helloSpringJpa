<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 카테고리 등록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>새 카테고리 등록</h2>
<form th:action="@{/categories/create}" th:object="${categoryForm}" method="post" class="mt-4">
    <div class="mb-3">
        <label for="name" class="form-label">카테고리 이름</label>
        <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="카테고리 이름을 입력하세요">
        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 에러</div>
    </div>
    <button type="submit" class="btn btn-primary">등록하기</button>
    <a th:href="@{/products}" class="btn btn-secondary">목록으로</a>
</form>

<div style="margin-top: 50px; padding: 20px; background-color: #f8f9fa; text-align: center; font-weight: bold;">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></p>
    <p>학번: 1971372 | 성명: 이현동</p>
</div>
</body>
</html>
