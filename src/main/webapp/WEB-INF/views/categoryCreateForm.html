<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 500px; margin: 100px auto; text-align: center; }
        input { width: 80%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: #28a745; color: white; border: none; padding: 10px 30px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
<h1>새 카테고리 추가</h1>
<form th:action="@{/categories/create}" th:object="${category}" method="post">
    <input type="text" th:field="*{name}" placeholder="카테고리 이름을 입력하세요" required>
    <br>
    <button type="submit" class="btn">추가하기</button>
</form>
<p><a th:href="@{/products}">목록으로 돌아가기</a></p>
</body>
</html>
