<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 수정</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background: orange; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1em; }
    </style>
</head>
<body>
<h1>상품 수정</h1>
<form th:action="@{/products/create}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="form-group">
        <label>상품명</label>
        <input type="text" th:field="*{name}" required>
    </div>
    <div class="form-group">
        <label>카테고리</label>
        <select th:field="*{category}">
            <option value="">카테고리 선택</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product.category != null and cat.id == product.category.id}"></option>
        </select>
    </div>
    <div class="form-group">
        <label>가격</label>
        <input type="number" th:field="*{price}" required>
    </div>
    <div class="form-group">
        <label>상품 설명</label>
        <textarea th:field="*{description}" rows="5"></textarea>
    </div>
    <button type="submit" class="btn-submit">수정 완료</button>
</form>
<p style="text-align: center; margin-top: 20px;"><a th:href="@{/products}">취소</a></p>
</body>
</html>
