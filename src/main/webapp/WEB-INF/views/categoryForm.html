<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 등록</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 500px; margin: 80px auto; padding: 0 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .error-msg { color: #e74c3c; font-size: 0.9em; margin-top: 5px; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; width: 100%; cursor: pointer; font-size: 1.1em; }
        .footer { margin-top: 50px; padding: 20px; background-color: #f8f9fa; text-align: center; }
    </style>
</head>
<body>
<h1>새 카테고리 등록</h1>

<form th:action="@{/categories/create}" th:object="${categoryForm}" method="post">
    <div class="form-group">
        <label>카테고리 이름</label>
        <input type="text" th:field="*{name}" placeholder="예: 전자기기, 도서, 식품">
        <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <button type="submit" class="btn-submit">등록 완료</button>
</form>

<p style="text-align: center; margin-top: 20px;"><a th:href="@{/categories}">취소하고 돌아가기</a></p>

<div class="footer">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></p>
    <p>학번: 1971372 | 성명: 이현동</p>
</div>
</body>
</html>
