<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록 - Product Management</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h1 { text-align: center; color: #333; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .search-form { display: flex; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #4a90d9; color: white; padding: 12px; }
        td { border-bottom: 1px solid #eee; padding: 10px; text-align: center; }
        .btn { padding: 8px 15px; border-radius: 4px; text-decoration: none; color: white; font-size: 0.9em; }
        .btn-create { background-color: #4a90d9; }
        .btn-category { background-color: #28a745; }
        .no-result { text-align: center; padding: 50px; color: #888; font-size: 1.2em; }
        .footer { margin-top: 50px; padding: 20px; background-color: #f8f9fa; text-align: center; border-top: 2px solid #eee; }
    </style>
</head>
<body>
<h1>상품 목록</h1>

<div class="nav-bar">
    <div>
        <a th:href="@{/products/create}" class="btn btn-create">+ 새 상품 등록</a>
        <a th:href="@{/categories}" class="btn btn-category">카테고리 관리</a>
    </div>

    <form th:action="@{/products}" method="get" class="search-form">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="상품명 검색" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        <select name="categoryId" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
            <option value="">-- 전체 카테고리 --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
        </select>
        <button type="submit" class="btn" style="background-color: #4a90d9; border: none; cursor: pointer;">검색</button>
    </form>
</div>

<table th:if="${!#lists.isEmpty(products)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>상품명</th>
        <th>카테고리</th>
        <th>가격</th>
        <th>작업</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}" style="color: #4a90d9; text-decoration: none; font-weight: bold;"></a></td>
        <td th:text="${product.category != null ? product.category.name : '-'}"></td>
        <td th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')} + '원'" style="color: #e74c3c; font-weight: bold;"></td>
        <td>
            <a th:href="@{/products/{id}/edit(id=${product.id})}" style="color: orange;">수정</a> |
            <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline;" onsubmit="return confirm('정말 삭제할까요?');">
                <button type="submit" style="background:none; border:none; color: #e74c3c; cursor:pointer; padding:0; font-size:1em;">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(products)}" class="no-result">
    <p>검색 결과가 없습니다.</p>
</div>

<div class="footer">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></p>
    <p>학번: 1971372 | 성명: 이현동</p>
</div>
</body>
</html>
